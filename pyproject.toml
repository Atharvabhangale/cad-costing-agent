[project]
name = "cad-costing-agent"
version = "0.1.0"
description = "Proof-of-concept foundation for estimating zero-base manufacturing cost of mechanical parts from CAD models."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "trimesh>=4.0",
    "numpy>=1.26",
    "python-multipart>=0.0.9",
    "cadquery-ocp>=7.8",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# The migration scripts are not an importable package (no __init__.py), so they
# have to be declared as package data or they would be missing from a real
# install and `run_migrations` would find no revisions.
[tool.setuptools.package-data]
cad_costing_agent = [
    "migrations/*.py",
    "migrations/*.mako",
    "migrations/versions/*.py",
    "static/*",
    "static/vendor/*",
]
