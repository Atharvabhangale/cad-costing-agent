# Alembic configuration for the CAD Costing Agent.
#
# Note: `sqlalchemy.url` is deliberately NOT set here. env.py takes the URL from
# the application's own configuration (CAD_COSTING_DATABASE_URL, defaulting to
# sqlite:///./cad_costing_agent.db), so there is exactly one place to configure
# the database and the CLI can never drift from what the app uses.

[alembic]
script_location = src/cad_costing_agent/migrations
prepend_sys_path = src
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
